name: Docker package
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Application checks
        run: |
          pip install -r requirements.txt httpx==0.28.1
          python -m unittest discover -s tests -v
      - name: Build and start
        env:
          SESSION_SECRET: ci-only-session-secret-not-for-production-123456789
        run: |
          docker compose config --quiet
          docker compose up -d --build --wait --wait-timeout 120
          curl --fail http://127.0.0.1:8420/login
          docker compose exec -T hni python -c "import os; assert os.getuid() == 10001"
          docker compose exec -T hni python -c "from pathlib import Path; Path('/data/persistence-probe').write_text('saved')"
          docker compose up -d --force-recreate --wait --wait-timeout 120
          docker compose exec -T hni python -c "from pathlib import Path; assert Path('/data/persistence-probe').read_text() == 'saved'"
      - name: Logs and cleanup
        if: always()
        env:
          SESSION_SECRET: ci-only-session-secret-not-for-production-123456789
        run: |
          docker compose logs
          docker compose down -v

  publish:
    needs: container
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Image name
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "name=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ steps.image.outputs.name }}
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,format=long
            type=ref,event=tag
      - name: Build and publish amd64 and arm64
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Create Compose package
        env:
          IMAGE: ${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}
        run: python scripts/package_compose.py --image "$IMAGE" --output dist
      - name: Test published image with packaged Compose
        env:
          SESSION_SECRET: ci-only-package-test-secret-12345678901234567890
        run: |
          docker compose -p hni-package -f dist/compose.yaml config --quiet
          docker compose -p hni-package -f dist/compose.yaml up -d --wait --wait-timeout 120
          curl --fail http://127.0.0.1:8420/login
      - uses: actions/upload-artifact@v4
        with:
          name: home-network-inventory-compose
          path: dist/home-network-inventory-compose.zip
          if-no-files-found: error
      - name: Package test cleanup
        if: always()
        env:
          SESSION_SECRET: ci-only-package-test-secret-12345678901234567890
        run: |
          if [ -f dist/compose.yaml ]; then
            docker compose -p hni-package -f dist/compose.yaml logs
            docker compose -p hni-package -f dist/compose.yaml down -v
          fi

  release:
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: home-network-inventory-compose
          path: dist
      - name: Attach Compose package to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/home-network-inventory-compose.zip --clobber
          else
            gh release create "$TAG" dist/home-network-inventory-compose.zip --verify-tag --generate-notes
          fi
