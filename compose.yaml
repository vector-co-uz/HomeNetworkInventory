services:
  hni:
    build: .
    image: home-network-inventory:local
    restart: unless-stopped
    init: true
    ports:
      - "${HNI_BIND_ADDRESS:-127.0.0.1}:${HNI_PORT:-8420}:8420"
    environment:
      DATABASE_URL: sqlite:////data/home_network.db
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in .env}
      SESSION_HTTPS_ONLY: ${SESSION_HTTPS_ONLY:-false}
      SESSION_TIMEOUT_SECONDS: ${SESSION_TIMEOUT_SECONDS:-7200}
    volumes:
      - hni_data:/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  hni_data:
